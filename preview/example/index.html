<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storyforge Preview Player</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1 id="series-title">Loading…</h1>
        <p id="series-description"></p>
      </div>
      <ul class="episode-list" id="episode-list"></ul>
    </aside>
    <div class="overlay" id="overlay"></div>
    <main class="main">
      <div class="top-bar">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle episode list">Episodes</button>
        <span class="series-title" id="top-series-title"></span>
      </div>
      <div class="player-area" id="player-area">
        <p class="loading" id="loading">Loading episodes…</p>
      </div>
    </main>
  </div>
  <script src="player.js"></script>
</body>
</html>
