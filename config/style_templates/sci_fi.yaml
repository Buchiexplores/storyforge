genre: sci_fi
description: Near-future speculative fiction with technology, discovery, and consequence.

visual_style: >
  cinematic near-future sci-fi, grounded realism, subtle holographic or device glow,
  clean architectural lines mixed with lived-in detail, moody contrast, no logos,
  no public figures, no readable real brand names

image_prompt_rules: |
  Strict beat-matching rule: show only technology, characters, and environments implied by
  this exact narration beat. Keep futuristic elements plausible and story-specific.
  Composition requirements: one cinematic story moment, vertical portrait, readable focal subject,
  layered depth, controlled color palette with one accent glow color.
  Text requirements: no subtitles, captions, title cards, watermarks, logos, or readable brand names
  unless the scene direction explicitly requests device-screen text.

cover:
  default_design_style: sci_fi_cyan
  hook_lines: ["THE", "SIGNAL", "ARRIVED"]
  hook_highlight: SIGNAL
  background_prompt: >
    near-future city at night with subtle holographic reflections, a glowing handheld device
    large in the foreground, distant architecture with clean negative space for title typography

platforms:
  tiktok:
    disclosure: "This is a fictional story."
    hashtags:
      - fictionstory
      - scifistory
      - storytime
      - futuristic
  youtube_shorts:
    disclosure: "Original fictional sci-fi story with human creative direction and AI-assisted visuals."
    hashtags:
      - FictionStory
      - SciFiStory
      - ShortStory
  instagram_reels:
    disclosure: "Fictional sci-fi story."
    hashtags:
      - fictionstory
      - scifireels
      - storytime
